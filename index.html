
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-Shirts</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    h1 { text-align: center; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .shirt {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px #00000010;
    }
    .shirt img { width: 100%; height: 180px; object-fit: contain; }
    .shirt h2 { font-size: 18px; min-height: 45px; }
    .price { font-weight: bold; }
    .shirt select, .shirt button { margin: 8px; padding: 8px; }
    .shirt button {
      background: #244db7;
      color: white;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
    .sold-out { color: #b22222; font-weight: bold; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="t-shirts.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
